name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Run dependency audit every Monday at 09:00 UTC
    - cron: '0 9 * * 1'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, build, and test
    runs-on: ubuntu-latest

    # The test suite mocks the DB layer for every route/unit test (see e.g.
    # src/routes/auth.test.ts), so `pnpm test` itself does not require a live
    # Postgres instance. We still spin one up here so we can apply the Drizzle
    # migrations for real and catch DB-wiring issues (missing/incorrect
    # migrations, etc.) that a fully-mocked test run would otherwise hide.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stellopay_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      # config.ts requires this at import time; tests never make real network
      # calls, so a dummy value (matching vitest.config.ts) is sufficient.
      STARKNET_RPC_URL: https://starknet-sepolia.public.invalid/rpc
      POSTGRES_CONNECTION_STRING: postgresql://postgres:postgres@localhost:5432/stellopay_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check env sync
        run: pnpm check:env

      - name: Check migrations naming
        run: pnpm check:migrations

      - name: Build
        run: pnpm build

      - name: Apply database migrations
        run: pnpm db:migrate

      - name: Run tests
        run: pnpm test

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security audit
        run: pnpm audit --prod --audit-level high
        continue-on-error: true
        id: audit

      # On push/PR: re-exit with failure so the workflow shows red, surfacing
      # the vulnerability to the developer before they merge.
      - name: Fail workflow on audit findings (push / PR)
        if: steps.audit.outcome == 'failure' && github.event_name != 'schedule'
        run: |
          echo "::error::pnpm audit found high or critical severity vulnerabilities. Run 'pnpm audit --prod --audit-level high' locally to see details."
          exit 1

      - name: Create issue on audit failure
        if: steps.audit.outcome == 'failure' && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🚨 Security: High/Critical vulnerabilities detected in dependencies';
            const body = `## Dependency Audit Failure
            
            The scheduled dependency audit has detected high or critical severity vulnerabilities in production dependencies.
            
            **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            **Triggered by:** Scheduled audit (weekly)
            **Date:** ${new Date().toISOString()}
            
            ### Action Required
            
            1. Review the workflow logs to identify affected packages
            2. Run \`pnpm audit\` locally to see detailed vulnerability reports
            3. Update vulnerable dependencies with \`pnpm update\` or apply patches
            4. Verify fixes with \`pnpm audit --prod --audit-level high\`
            
            ### Commands
            
            \`\`\`bash
            # View detailed audit report
            pnpm audit
            
            # Fix automatically where possible
            pnpm audit --fix
            
            # Update specific package
            pnpm update <package-name>
            \`\`\`
            
            This issue was automatically created by the CI dependency-audit job.`;
            
            // Check if an open issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,dependencies',
            });
            
            const existingIssue = issues.data.find(issue => 
              issue.title.includes('vulnerabilities detected in dependencies')
            );
            
            if (existingIssue) {
              // Add a comment to the existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `Another audit failure detected:\n\n${body}`
              });
              console.log(`Updated existing issue #${existingIssue.number}`);
            } else {
              // Create a new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['security', 'dependencies']
              });
              console.log('Created new security issue');
            }
